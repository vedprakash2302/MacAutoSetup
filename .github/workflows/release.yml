name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck stow zsh
      - run: ./tests/test.sh
      - name: Build pinned bootstrap asset
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          sed -e "s/__RELEASE_REF__/$RELEASE_REF/g" -e "s/__RELEASE_COMMIT__/$RELEASE_COMMIT/g" bootstrap > dist/bootstrap
          chmod +x dist/bootstrap
          sha256sum dist/bootstrap > dist/bootstrap.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/bootstrap dist/bootstrap.sha256 --generate-notes --verify-tag
