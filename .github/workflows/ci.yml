name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y shellcheck stow zsh
          else
            brew install shellcheck stow
          fi
      - run: ./tests/test.sh
      - name: Validate Brewfile providers without installing applications
        if: runner.os == 'macOS'
        run: ./tests/brewfile-validation.sh

  amazon-linux:
    runs-on: ubuntu-24.04
    container: amazonlinux:2023
    steps:
      - name: Install checkout and test dependencies
        run: dnf install -y git-core bash findutils gzip tar
      - uses: actions/checkout@v4
      - name: Validate Amazon Linux provider
        run: ./tests/amazon-linux.sh
